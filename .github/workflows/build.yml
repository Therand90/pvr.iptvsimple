name: Build
on: [push, pull_request]
env:
  app_id: pvr.iptvsimple

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "GCC build"
            CC: gcc
            CXX: g++
          - name: "Clang build"
            CC: clang
            CXX: clang++
    steps:
    - name: Checkout Kodi repo
      uses: actions/checkout@v5
      with:
        repository: xbmc/xbmc
        ref: Omega
        path: xbmc
    - name: Checkout add-on repo
      uses: actions/checkout@v5
      with:
        path: ${{ env.app_id }}
    - name: Apply Therand Omega package metadata
      run: |
        python - <<'PY'
        from pathlib import Path
        import re

        addon = Path("pvr.iptvsimple/pvr.iptvsimple/addon.xml.in")
        text = addon.read_text(encoding="utf-8")
        text, count = re.subn(
            r'(?m)^(\s*version=")[^"]+(".*)$',
            r'\g<1>21.99.0+therand.3\2',
            text,
            count=1,
        )
        if count != 1:
            raise SystemExit("Could not patch addon version")
        text = text.replace(
            'name="IPTV Simple Client"',
            'name="IPTV Simple Client (Therand DVR)"',
            1,
        )
        text = text.replace(
            'provider-name="nightik and Ross Nicholson"',
            'provider-name="nightik, Ross Nicholson and Therand90"',
            1,
        )
        addon.write_text(text, encoding="utf-8")
        PY
    - name: Prepare
      run: |
        mkdir -p ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}
        echo ${app_id} ${{ github.workspace }}/${app_id} > ${{ github.workspace }}/xbmc/cmake/addons/addons/${app_id}/${app_id}.txt
    - name: Configure
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        cmake \
          -B ${app_id}/build \
          -DADDONS_TO_BUILD=${app_id} \
          -DADDON_SRC_PREFIX=${{ github.workspace }} \
          -DADDONS_DEFINITION_DIR=${{ github.workspace }}/xbmc/cmake/addons/addons \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/xbmc/addons \
          -DPACKAGE_ZIP=1 \
          ${{ github.workspace }}/xbmc/cmake/addons
    - name: Build
      env:
        CC: ${{ matrix.CC }}
        CXX: ${{ matrix.CXX }}
      run: |
        make -C ${app_id}/build -j$(getconf _NPROCESSORS_ONLN)
    - name: Package Therand Omega ZIP
      if: matrix.CC == 'gcc'
      run: |
        make -C ${app_id}/build package-${app_id}
        find ${app_id}/build/build/zips -maxdepth 2 -type f -name '*.zip' -print
    - name: Upload Therand Omega ZIP
      if: matrix.CC == 'gcc'
      uses: actions/upload-artifact@v4
      with:
        name: pvr.iptvsimple-omega-therand
        path: ${{ env.app_id }}/build/build/zips/**/*.zip
        if-no-files-found: error
